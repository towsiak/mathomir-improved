          ./tools/windows-smoke.ps1

      - name: Upload native memory diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Native-Memory-Diagnostics
          path: |
            source/build/overlap-ui.png
            source/build/large-resize-grip-ui.png
            source/build/sparse-stroke-ui.png
            source/build/formula-reference-test-result.txt
            source/build/formula-all-models.mom
