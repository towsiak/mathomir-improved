name: Build Windows app
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch original source and apply repair
        shell: pwsh
        run: |
          git clone https://github.com/mathomir/Mathomir_GIT.git source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C source checkout 0300c13e5108fb6112403b20f576d977db3309f9
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C source apply --ignore-space-change ../interaction-repair.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C source apply --ignore-space-change ../graph-overlap-followup.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C source apply --ignore-space-change ../unit-circle-signed-arc.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C source apply --ignore-space-change ../print-grid.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C source apply --ignore-space-change ../integral-evaluation.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C source apply --ignore-space-change ../integral-followup.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C source apply --ignore-space-change ../log-base.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C source apply --ignore-space-change ../selection-approx.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C source apply --ignore-space-change ../ai-help.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C source apply --ignore-space-change ../cursor-stability.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C source apply --ignore-space-change ../unit-common-coordinates.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C source apply --ignore-space-change ../groq-context-approx.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C source apply --ignore-space-change ../ai-math-reader.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C source apply --ignore-space-change ../page-toolbar.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C source apply --ignore-space-change ../enlarged-text-overlap.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C source apply --ignore-space-change ../title-file-path.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C source apply --ignore-space-change ../placement-lifecycle.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C source apply --ignore-space-change ../large-resize-grip.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C source apply --ignore-space-change ../freehand-rounding.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C source apply --ignore-space-change ../coordinate-axes-editor.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C source apply --ignore-space-change ../formula-reference-ai.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C source apply --ignore-space-change ../latex-rendering.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item Mathomir.vcxproj source/Mathomir/
          ./tools/setup-math-renderer.ps1
      - name: Locate MSBuild and check MFC
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.ATLMFC -property installationPath
          if (!$vs) { throw 'Visual Studio with MFC is required on the runner.' }
          "MSBUILD=$vs\MSBuild\Current\Bin\MSBuild.exe" >> $env:GITHUB_ENV
      - name: Build Release Win32
        shell: pwsh
        run: |
          & $env:MSBUILD source/Mathomir/Mathomir.vcxproj /m /p:Configuration=Release /p:Platform=Win32 /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Formula reference and free AI UI checks
        shell: pwsh
        run: |
          ./tools/formula-reference-model-test.ps1
          ./tools/formula-reference-smoke.ps1
      - name: Coordinate axes editor geometry and UI checks
        shell: pwsh
        run: |
          ./tools/coordinate-axes-model-test.ps1
          ./tools/coordinate-axes-editor-smoke.ps1
      - name: Sparse freehand curve geometry and UI checks
        shell: pwsh
        run: |
          ./tools/smart-stroke-test.ps1
          ./tools/sparse-stroke-smoke.ps1
      - name: Large object resize grip UI checks
        shell: pwsh
        run: ./tools/large-resize-grip-smoke.ps1
      - name: Overlapping annotations UI checks
        shell: pwsh
        run: ./tools/overlap-smoke.ps1
      - name: AI formatted text and native math engine checks
        shell: pwsh
        run: ./tools/ai-presentation-test.ps1
      - name: Enlarged text placement and selection UI checks
        shell: pwsh
        run: ./tools/enlarged-text-overlap-smoke.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Enlarged-Overlap-Preview
          path: |
            source/build/enlarged-overlap-ui.png
            source/build/large-resize-grip-ui.png
            source/build/sparse-stroke-ui.png
            source/build/formula-reference-test-result.txt
            source/build/formula-all-models.mom
            source/build/formula-reference-ui.png
            source/build/formula-free-ai-ui.png
            source/build/formula-reference-canvas-ui.png
            source/build/formula-reference-typeset.txt
            source/build/math-web-*.json
            source/build/formula-ai-fixture.jsonl
            source/build/coordinate-axes-editor-ui.png
            source/build/coordinate-axes-canvas-ui.png
            source/build/coordinate-axes-menu.txt
            source/build/coordinate-axes-*.mom
            source/build/sparse-rounded-freehand.mom
          if-no-files-found: ignore
      - name: Full file path title UI checks
        shell: pwsh
        run: ./tools/title-path-smoke.ps1
      - name: Mixed text and math cursor checks
        shell: pwsh
        run: ./tools/cursor-stability-smoke.ps1
      - name: AI protocol checks
        shell: pwsh
        run: ./tools/ai-protocol-test.ps1
      - name: AI help and connection setup UI checks
        shell: pwsh
        run: ./tools/ai-help-smoke.ps1
      - name: Selection approximation UI checks
        shell: pwsh
        run: ./tools/selection-approx-smoke.ps1
      - name: Arbitrary log-base numerical checks
        shell: pwsh
        run: ./tools/log-base-test.ps1
      - name: Arbitrary log-base Windows UI checks
        shell: pwsh
        run: ./tools/log-base-smoke.ps1
      - name: Integral numerical checks
        shell: pwsh
        run: ./tools/integral-area-test.ps1
      - name: Integral shader and inline evaluation UI checks
        shell: pwsh
        run: ./tools/integral-evaluation-smoke.ps1
      - name: Page configuration toolbar UI checks
        shell: pwsh
        run: ./tools/page-toolbar-smoke.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Page-Toolbar-Preview
          path: source/build/page-toolbar-ui.png
      - name: Print grid and preview checks
        shell: pwsh
        run: ./tools/print-grid-smoke.ps1
      - name: Signed unit-circle geometry checks
        shell: pwsh
        run: ./tools/unit-circle-geometry-test.ps1
      - name: Signed unit-circle UI checks
        shell: pwsh
        run: ./tools/unit-circle-smoke.ps1
      - name: Grid styles and snapping UI checks
        shell: pwsh
        run: ./tools/canvas-grid-smoke.ps1
      - name: Tooltips and rounding UI checks
        shell: pwsh
        run: ./tools/feature-help-smoke.ps1
      - name: Statistics UI checks
        id: stats_ui
        shell: pwsh
        run: ./tools/statistics-smoke.ps1
      - name: Windows UI smoke checks
        id: windows_ui
        shell: pwsh
        run: ./tools/windows-smoke.ps1
      - name: Diagnose memory errors after failed UI checks
        if: failure() && (steps.stats_ui.conclusion == 'failure' || steps.windows_ui.conclusion == 'failure')
        shell: pwsh
        run: |
          & $env:MSBUILD source/Mathomir/Mathomir.vcxproj /t:Rebuild /m /p:Configuration=Release /p:Platform=Win32 /p:EnableASAN=true /p:DebugInformationFormat=ProgramDatabase /p:GenerateDebugInformation=true /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -property installationPath
          $compiler = Get-ChildItem "$vs\VC\Tools\MSVC" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $env:PATH = "$($compiler.FullName)\bin\Hostx64\x86;$env:PATH"
          $env:ASAN_OPTIONS = "log_path=asan"
          $env:MATHOMIR_DIAGNOSTIC_STARTUP = '1'
          ./tools/formula-reference-model-test.ps1
          ./tools/formula-reference-smoke.ps1 -OnlineFixture
          ./tools/coordinate-axes-editor-smoke.ps1
          ./tools/statistics-smoke.ps1
          ./tools/windows-smoke.ps1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Integral-Diagnostics
          path: |
            source/build/overlap-ui.png
            source/build/graph-diagnostics.txt
            source/build/*integral*.mom
            source/build/integral-ui.png
            source/build/selection-approx-ui.png
            source/build/selection-approx-*-smoke.mom
            source/build/selection-approx-diagnostics.txt
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Selection-Approximation-Preview
          path: |
            source/build/selection-approx-ui.png
            source/build/unit-common-coordinates-ui.png
            source/build/overlap-ui.png
            source/build/large-resize-grip-ui.png
            source/build/sparse-stroke-ui.png
            source/build/formula-reference-test-result.txt
            source/build/formula-all-models.mom
            source/build/formula-reference-ui.png
            source/build/formula-free-ai-ui.png
            source/build/formula-reference-canvas-ui.png
            source/build/formula-reference-typeset.txt
            source/build/math-web-*.json
            source/build/formula-ai-fixture.jsonl
            source/build/coordinate-axes-editor-ui.png
            source/build/coordinate-axes-canvas-ui.png
            source/build/coordinate-axes-menu.txt
            source/build/coordinate-axes-*.mom
            source/build/sparse-rounded-freehand.mom
            source/build/large-resize-grip-*.mom
            source/build/enlarged-hit-diagnostics.txt
            source/build/enlarged-overlap-ui.png
            source/build/enlarged-overlap-*.mom
            source/build/ai-help-ui.png
          if-no-files-found: ignore
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item source/build/Mathomir.exe package/
          Copy-Item source/build/MathomirMath package/MathomirMath -Recurse
          Copy-Item source/ReadMe.txt package/LICENSE.txt
          Copy-Item REPAIR_NOTES.txt package/
          Copy-Item source/Mathomir/res/MathomirHandyHelp.chm package/
      - uses: actions/upload-artifact@v4
        with:
          name: Mathomir-Windows-Repair
          path: package/
          if-no-files-found: error
  memory_check:
    name: Native operations memory checks
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch original source and apply repair
        shell: pwsh
        run: |
          git clone https://github.com/mathomir/Mathomir_GIT.git source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C source checkout 0300c13e5108fb6112403b20f576d977db3309f9
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C source apply --ignore-space-change ../interaction-repair.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C source apply --ignore-space-change ../graph-overlap-followup.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C source apply --ignore-space-change ../unit-circle-signed-arc.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C source apply --ignore-space-change ../print-grid.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C source apply --ignore-space-change ../integral-evaluation.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C source apply --ignore-space-change ../integral-followup.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C source apply --ignore-space-change ../log-base.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C source apply --ignore-space-change ../selection-approx.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C source apply --ignore-space-change ../ai-help.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C source apply --ignore-space-change ../cursor-stability.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C source apply --ignore-space-change ../unit-common-coordinates.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C source apply --ignore-space-change ../groq-context-approx.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C source apply --ignore-space-change ../ai-math-reader.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C source apply --ignore-space-change ../page-toolbar.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C source apply --ignore-space-change ../enlarged-text-overlap.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C source apply --ignore-space-change ../title-file-path.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C source apply --ignore-space-change ../placement-lifecycle.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C source apply --ignore-space-change ../large-resize-grip.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C source apply --ignore-space-change ../freehand-rounding.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C source apply --ignore-space-change ../coordinate-axes-editor.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C source apply --ignore-space-change ../formula-reference-ai.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C source apply --ignore-space-change ../latex-rendering.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item Mathomir.vcxproj source/Mathomir/
          ./tools/setup-math-renderer.ps1
      - name: Locate MSBuild and check MFC
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.ATLMFC -property installationPath
          if (!$vs) { throw 'Visual Studio with MFC is required on the runner.' }
          "MSBUILD=$vs\MSBuild\Current\Bin\MSBuild.exe" >> $env:GITHUB_ENV
      - name: Build and exercise AddressSanitizer executable
        shell: pwsh
