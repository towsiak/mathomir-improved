name: Build Windows app
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch original source and apply repair
        shell: pwsh
        run: |
          git clone https://github.com/mathomir/Mathomir_GIT.git source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C source checkout 0300c13e5108fb6112403b20f576d977db3309f9
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C source apply --ignore-space-change ../interaction-repair.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C source apply --ignore-space-change ../graph-overlap-followup.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C source apply --ignore-space-change ../unit-circle-signed-arc.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C source apply --ignore-space-change ../print-grid.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item Mathomir.vcxproj source/Mathomir/
      - name: Locate MSBuild and check MFC
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.ATLMFC -property installationPath
          if (!$vs) { throw 'Visual Studio with MFC is required on the runner.' }
          "MSBUILD=$vs\MSBuild\Current\Bin\MSBuild.exe" >> $env:GITHUB_ENV
      - name: Build Release Win32
        shell: pwsh
        run: |
          & $env:MSBUILD source/Mathomir/Mathomir.vcxproj /m /p:Configuration=Release /p:Platform=Win32 /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Print grid and preview checks
        shell: pwsh
        run: ./tools/print-grid-smoke.ps1
      - name: Signed unit-circle geometry checks
        shell: pwsh
        run: ./tools/unit-circle-geometry-test.ps1
      - name: Signed unit-circle UI checks
        shell: pwsh
        run: ./tools/unit-circle-smoke.ps1
      - name: Overlapping annotations UI checks
        shell: pwsh
        run: ./tools/overlap-smoke.ps1
      - name: Grid styles and snapping UI checks
        shell: pwsh
        run: ./tools/canvas-grid-smoke.ps1
      - name: Tooltips and rounding UI checks
        shell: pwsh
        run: ./tools/feature-help-smoke.ps1
      - name: Statistics UI checks
        id: stats_ui
        shell: pwsh
        run: ./tools/statistics-smoke.ps1
      - name: Windows UI smoke checks
        id: windows_ui
        shell: pwsh
        run: ./tools/windows-smoke.ps1
      - name: Diagnose memory errors after failed UI checks
        if: failure() && (steps.stats_ui.conclusion == 'failure' || steps.windows_ui.conclusion == 'failure')
        shell: pwsh
        run: |
          & $env:MSBUILD source/Mathomir/Mathomir.vcxproj /t:Rebuild /m /p:Configuration=Release /p:Platform=Win32 /p:EnableASAN=true /p:DebugInformationFormat=ProgramDatabase /p:GenerateDebugInformation=true /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -property installationPath
          $compiler = Get-ChildItem "$vs\VC\Tools\MSVC" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $env:PATH = "$($compiler.FullName)\bin\Hostx64\x86;$env:PATH"
          $env:ASAN_OPTIONS = "log_path=asan"
          $env:MATHOMIR_DIAGNOSTIC_STARTUP = '1'
          ./tools/statistics-smoke.ps1
          ./tools/windows-smoke.ps1
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item source/build/Mathomir.exe package/
          Copy-Item source/ReadMe.txt package/LICENSE.txt
          Copy-Item REPAIR_NOTES.txt package/
          Copy-Item source/Mathomir/res/MathomirHandyHelp.chm package/
      - uses: actions/upload-artifact@v4
        with:
          name: Mathomir-Windows-Repair
          path: package/
          if-no-files-found: error
